# MediaMTX config for the drone camera (Pi Camera Module on the CSI port).
# Serves low-latency HLS on port 8888 at /cam/index.m3u8.
# Settings not listed here keep MediaMTX's defaults.

logLevel: info

# Only HLS is exposed to the internet (via Tailscale Funnel).
# RTSP stays on for local testing, e.g. VLC -> rtsp://<pi-ip>:8554/cam
rtmp: no
srt: no
webrtc: no

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: yes

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 30
    rpiCameraBitrate: 2000000
